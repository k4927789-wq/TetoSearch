<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navegador Privado</title>
  <!-- Estilos aislados contra inyecciones de extensiones -->
  <link rel="stylesheet" href="style.css">
  <!-- Deshabilitar caché local e historial del navegador host -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN SUPERIOR -->
  <header class="browser-bar">
    <div class="nav-controls">
      <button id="back-btn" title="Atrás" disabled>&#8592;</button>
      <button id="forward-btn" title="Adelante" disabled>&#8594;</button>
      <button id="reload-btn" title="Recargar">&#8635;</button>
      <button id="home-btn" title="Inicio">&#8962;</button>
    </div>

    <form id="search-form" class="url-form">
      <input 
        type="text" 
        id="url-input" 
        placeholder="Busca en la web o escribe una URL..." 
        autocomplete="off" 
        autocorrect="off" 
        autocapitalize="off" 
        spellcheck="false"
      >
      <button type="submit">Buscar</button>
    </form>

    <div class="menu-controls">
      <button id="history-toggle-btn" title="Historial Privado">&#128336;</button>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="viewport-container">
    <!-- Pantalla de inicio estilo Google -->
    <section id="home-screen" class="home-screen">
      <h1 class="logo">Search<span>Private</span></h1>
      <form id="home-search-form" class="home-search-box">
        <input type="text" id="home-search-input" placeholder="Buscar en Google o escribir dirección..." autocomplete="off">
        <div class="home-buttons">
          <button type="submit">Buscar en la Web</button>
        </div>
      </form>
    </section>

    <!-- Visualizador Aislado de Páginas Web -->
    <div id="frame-wrapper" class="frame-wrapper hidden">
      <!-- Sandbox estricto contra lecturas de extensiones del navegador -->
      <iframe 
        id="web-viewport" 
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"
        referrerpolicy="no-referrer"
      ></iframe>
    </div>

    <!-- Panel de Historial (Solo en memoria RAM) -->
    <aside id="history-panel" class="history-panel hidden">
      <div class="history-header">
        <h3>Historial Privado (Sesión Actual)</h3>
        <button id="close-history">&#10005;</button>
      </div>
      <p class="history-note">Este historial vive únicamente en la memoria de esta pestaña. Se borra automáticamente al cerrar la página.</p>
      <ul id="history-list"></ul>
      <button id="clear-history-btn">Borrar Historial Ahora</button>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
