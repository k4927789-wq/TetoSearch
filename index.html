<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TetoSearch - Navegador Privado</title>
  <link rel="icon" type="image/jpeg" href="https://files.catbox.moe/4yxgvp.jpeg">
  <link rel="stylesheet" href="style.css">
  
  <!-- Deshabilitar almacenamiento en caché del sistema -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body oncontextmenu="return false;">

  <div id="app-container">
    <!-- ENCABEZADO -->
    <header class="top-header">
      <button id="btn-ram-history" class="header-link">Historial Privado (RAM)</button>
      <div class="avatar-box">
        <img src="https://files.catbox.moe/4yxgvp.jpeg" alt="Teto Icon" class="avatar-img">
      </div>
    </header>

    <!-- PANTALLA PRINCIPAL DE BÚSQUEDA -->
    <main id="search-view" class="main-view">
      
      <div class="banner-box">
        <img src="https://files.catbox.moe/pe3jle.jpeg" alt="Teto Banner" class="banner-img">
      </div>

      <h1 class="brand-title"><span class="red">Teto</span><span class="pink">Search</span></h1>

      <form id="teto-search-form" class="search-bar-container">
        <span class="search-icon">&#128269;</span>
        <input type="text" id="main-search-input" placeholder="Escribe lo que quieras buscar o una URL..." autocomplete="off" spellcheck="false">
      </form>

      <div class="action-buttons">
        <button type="submit" form="teto-search-form" class="btn-primary">Buscar en la Web</button>
        <button type="button" id="btn-panic" class="btn-danger">Pánico (Borrar RAM)</button>
      </div>
    </main>

    <!-- RESULTADOS / NAVEGADOR -->
    <section id="results-view" class="results-view hidden">
      <div class="nav-bar">
        <button id="btn-home" title="Inicio">&#8962;</button>
        <input type="text" id="nav-url-input" class="nav-input">
        <button id="btn-clear-session" title="Limpiar">&#10005;</button>
      </div>

      <!-- Contenedor donde se renderizan los resultados dinámicos sin iframe bloqueado -->
      <div id="results-content" class="results-content"></div>
    </section>

    <!-- PANEL DE HISTORIAL -->
    <aside id="history-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Historial en Memoria RAM</h3>
          <button id="close-history">&times;</button>
        </div>
        <p class="history-info">Este historial solo existe en la memoria volátil. Si cierras la pestaña o pulsas "Borrar", no quedará registro en la computadora ni en el navegador.</p>
        <ul id="history-ul"></ul>
        <button id="btn-purge-ram" class="btn-danger full-width">Destruir Historial de Memoria</button>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
